<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      document.documentElement.classList.add('js');
      // first visit, not a deep link: show the intro (state key mirrors src/state.ts)
      try {
        var seen = JSON.parse(localStorage.getItem('bov:v1') || '{}').seen;
        var h = location.hash.replace('#', '');
        if (!seen && (h === '' || h === 'boot'))
          document.documentElement.classList.add('has-intro');
      } catch (e) {
        if (!location.hash) document.documentElement.classList.add('has-intro');
      }
    </script>
    <link rel="preload" href="/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/hanken-grotesk-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--site:head-->
  </head>
  <body>
    <!--site:body-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
